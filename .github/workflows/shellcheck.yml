name: ShellCheck Linting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: Run ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

      - name: Validate Bash Syntax
        run: |
          bash -n install_xray.sh

      - name: Validate Embedded Python Syntax
        run: |
          python3 tests/validate_embedded_python.py

      - name: Setup Bats and Run Tests
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y bats
          bats tests/
