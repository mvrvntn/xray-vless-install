name: ShellCheck Linting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: Run ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          additional_files: 'install_xray.sh'

      - name: Validate Embedded Python Syntax
        run: |
          python3 -c "
          import re, ast
          with open('install_xray.sh', 'r', encoding='utf-8') as f:
              content = f.read()
          blocks = re.findall(r'python3\s+<<\s*[\'\"]?EOF[\'\"]?\s*\n(.*?)\nEOF', content, re.DOTALL)
          for i, block in enumerate(blocks):
              ast.parse(block)
          "

      - name: Setup Bats and Run Tests
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y bats
          bats tests/
